<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        margin: 0;
        padding: 16px;
        background-color: #1e1e1e;
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        width: 220px;
        box-sizing: border-box;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 12px 0;
        text-align: center;
        font-weight: 600;
        color: #fff;
        word-break: break-all;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
        margin-bottom: 8px;
      }
      #toggle-btn {
        background-color: #333;
        color: #fff;
      }
      #toggle-btn.enabled {
        background-color: #cc3333;
        color: #fff;
      }
      #toggle-btn.enabled:hover {
        background-color: #e64d4d;
      }
      #toggle-btn.disabled {
        background-color: #2ea44f;
        color: #fff;
      }
      #toggle-btn.disabled:hover {
        background-color: #2c974b;
      }
      #refresh-btn {
        background-color: #444;
        color: #fff;
        margin-bottom: 0;
      }
      #refresh-btn:hover {
        background-color: #555;
      }
      #refresh-notice {
        font-size: 11px;
        color: #ffa500;
        text-align: center;
        margin-top: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h3 id="domain-title">Loading...</h3>
    <button id="toggle-btn" class="disabled">Enable for Site</button>
    <button id="refresh-btn">Refresh Page</button>
    <div id="refresh-notice">Refresh page to force changes</div>
    <script src="popup.js"></script>
  </body>
</html>
