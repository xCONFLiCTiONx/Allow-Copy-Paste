<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --bg-color: #121214;
        --card-bg: #1a1a1e;
        --border-color: #2a2a30;
        --text-main: #f4f4f5;
        --text-muted: #a1a1aa;
        --accent-green: #10b981;
        --accent-green-hover: #059669;
        --accent-red: #ef4444;
        --accent-red-hover: #dc2626;
        --btn-secondary: #27272a;
        --btn-secondary-hover: #3f3f46;
      }

      body {
        margin: 0;
        padding: 16px;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        width: 250px;
        box-sizing: border-box;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .header-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }

      .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      h3 {
        font-size: 13px;
        margin: 0;
        font-weight: 600;
        color: var(--text-main);
        word-break: break-all;
        line-height: 1.4;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      button {
        width: 100%;
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      button:active {
        transform: scale(0.98);
      }

      #toggle-btn.disabled {
        background-color: var(--accent-green);
        color: #fff;
      }
      #toggle-btn.disabled:hover {
        background-color: var(--accent-green-hover);
      }

      #toggle-btn.enabled {
        background-color: var(--accent-red);
        color: #fff;
      }
      #toggle-btn.enabled:hover {
        background-color: var(--accent-red-hover);
      }

      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .sub-btn {
        background-color: var(--btn-secondary);
        color: var(--text-main);
        font-size: 12px;
        padding: 8px;
      }
      .sub-btn:hover {
        background-color: var(--btn-secondary-hover);
      }

      #refresh-notice {
        font-size: 11px;
        color: #fbbf24;
        text-align: center;
        line-height: 1.3;
        margin-top: 2px;
        display: none;
        background: rgba(251, 191, 36, 0.1);
        padding: 6px;
        border-radius: 4px;
        border: 1px solid rgba(251, 191, 36, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-card">
        <div class="label">Current Site</div>
        <h3 id="domain-title">Loading...</h3>
      </div>

      <div class="actions">
        <button id="toggle-btn" class="disabled">Enable for Site</button>
        
        <div class="btn-group">
          <button id="refresh-btn" class="sub-btn">Refresh</button>
          <button id="test-btn" class="sub-btn">Test Page</button>
        </div>
      </div>

      <div id="refresh-notice">You may need to refresh the page</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
